name: recursos-hidricos-sde

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env.produccion}
      MYSQL_DATABASE: ${DB_NAME:?Definí DB_NAME en .env.produccion}
      MYSQL_USER: ${DB_USER:?Definí DB_USER en .env.produccion}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env.produccion}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal

  backend:
    build:
      context: ./backend
    image: recursos-hidricos-sde-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?Definí DB_USER en .env.produccion}
      DB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env.produccion}
      # Solo lo usa el entrypoint para rechazar placeholders públicos en producción.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env.produccion}
      DB_NAME: ${DB_NAME:?Definí DB_NAME en .env.produccion}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env.produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    image: recursos-hidricos-sde-frontend:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

volumes:
  mysql_data:
  uploads_data:

networks:
  internal:
    driver: bridge
