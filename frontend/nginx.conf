server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multer acepta archivos de hasta 10 MB. Damos margen para el
    # overhead de multipart así el error de tamaño lo devuelve la API
    # en JSON (400) en lugar de un 413 de nginx.
    client_max_body_size 12m;

    # Resolución dinámica del servicio backend: si el contenedor se
    # recrea con otra IP, nginx no queda apuntando a la IP vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:4000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── API ───────────────────────────────────────────
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ─── Archivos subidos (servidos por Express) ───────
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # ─── Assets de Vite (nombres con hash) ─────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nunca se cachea (apunta a los assets hasheados).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── SPA fallback ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
